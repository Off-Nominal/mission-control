# Builds the production image on Blacksmith and publishes it to GHCR.
# Coolify should pull ghcr.io/<owner>/mission-control:main.
# It should not build this repository on the VPS.
# Set the COOLIFY_WEBHOOK secret to the app's deploy webhook to redeploy
# after a push to main.

name: Container image

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: Dockerfile

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Ask Coolify to pull the new image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set. The image was published. Redeploy that image from Coolify, or add this secret to do it from here."
            exit 0
          fi
          if ! curl --fail --silent --show-error --output /dev/null --max-time 60 "$COOLIFY_WEBHOOK"; then
            echo "Coolify did not accept the deploy webhook."
            exit 1
          fi
          echo "Coolify accepted the deploy webhook."

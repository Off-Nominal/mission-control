# Nixpacks (v1.41.0, used by Coolify) only ships Node 18/22/24 and silently falls back to
# Node 18 for engines "26.x". Install the official Node release instead, pinned and
# checksum-verified, and drop Nixpacks' own Node/npm so nothing else is on PATH.
# To upgrade: bump NODE_VERSION and NODE_SHA256 (from https://nodejs.org/dist/vX.Y.Z/SHASUMS256.txt,
# the linux-x64.tar.gz line) together, and keep .nvmrc in sync.

[variables]
NODE_VERSION = "26.12.1"
NODE_SHA256 = "0fd1eb7770598f52a21995edf6ed35fc690400fa437c2386af329519e9143132"

[phases.setup]
nixPkgs = []
# libatomic1: the official Node 26 linux binary dynamically links libatomic.so.1.
aptPkgs = ["...", "curl", "ca-certificates", "libatomic1"]
# The base image's PATH omits /usr/local/bin; `paths` prepends to NIXPACKS_PATH, which
# /root/.profile puts first for every login-shell RUN and for the start command.
paths = ["/opt/node/bin"]
cmds = [
  "curl -fsSL -o /tmp/node.tar.gz https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz",
  "echo \"${NODE_SHA256}  /tmp/node.tar.gz\" | sha256sum -c -",
  "mkdir -p /opt/node && tar -xzf /tmp/node.tar.gz -C /opt/node --strip-components=1 --no-same-owner && rm /tmp/node.tar.gz",
  "node -v && npm -v",
]
